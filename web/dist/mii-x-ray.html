is long || value is decimal || value is float)\r\n        {\r\n            return Convert.ToDouble(value, Invariant);\r\n        }\r\n\r\n        if (value is bool)\r\n        {\r\n            return (bool)value ? 1 : 0;\r\n        }\r\n\r\n        double result;\r\n        return double.TryParse(ToStr(value).Trim(), NumberStyles.Float, Invariant, out result) ? result : 0;\r\n    }\r\n\r\n    /// <summary>number(x): converts strictly; empty text, \"null\", \"---\" and other text fail in MII.</summary>\r\n    public static double Number(object value)\r\n    {\r\n        if (value is double || value is int || value is long || value is decimal || value is float || value is bool)\r\n        {\r\n            return ToDouble(value);\r\n        }\r\n\r\n        double result;\r\n\r\n        if (double.TryParse(ToStr(value).Trim(), NumberStyles.Float, Invariant, out result))\r\n        {\r\n            return result;\r\n        }\r\n\r\n        throw new FormatException(\"number(\\\"\" + ToStr(value) + \"\\\") fails in MII: the text is no number\");\r\n    }\r\n\r\n    /// <summary>if(condition, a, b) returns a number in MII, also for text branches: text that is no number gives 0\r\n    /// (assigned to a string) or a type cast error (inside a string function); stringif returns text.</summary>\r\n    public static double If(bool condition, object whenTrue, object whenFalse)\r\n    {\r\n        return ToDouble(condition ? whenTrue : whenFalse);\r\n    }\r\n\r\n    public static int ToInt(object value)\r\n    {\r\n        double number = ToDouble(value);\r\n        return number > int.MaxValue ? int.MaxValue : number < int.MinValue ? int.MinValue : (int)number;\r\n    }\r\n\r\n    public static long ToLong(object value)\r\n    {\r\n        if (value is long)\r\n        {\r\n            return (long)value;\r\n        }\r\n\r\n        long result;\r\n\r\n        if (long.TryParse(ToStr(value).Trim(), NumberStyles.Integer, Invariant, out result))\r\n        {\r\n            return result;\r\n        }\r\n\r\n        return (long)ToDouble(value);\r\n    }\r\n\r\n    public static decimal ToDecimal(object value)\r\n    {\r\n        if (value is decimal)\r\n        {\r\n            return (decimal)value;\r\n        }\r\n\r\n        decimal result;\r\n\r\n        if (decimal.TryParse(ToStr(value).Trim(), NumberStyles.Float, Invariant, out result))\r\n        {\r\n            return result;\r\n        }\r\n\r\n        double number = ToDouble(value);\r\n        return number > (double)decimal.MaxValue || number < (double)decimal.MinValue ? 0m : (decimal)number;\r\n    }\r\n\r\n    public static DateTime ToDateTime(object value)\r\n    {\r\n        if (value is DateTime)\r\n        {\r\n            return (DateTime)value;\r\n        }\r\n\r\n        DateTime result;\r\n\r\n        if (DateTime.TryParseExact(ToStr(value).Trim(), DateFormats, Invariant, DateTimeStyles.None, out result))\r\n        {\r\n            return result;\r\n        }\r\n\r\n        return DateTime.MinValue;\r\n    }\r\n\r\n    public static XmlDocument ToXml(object value)\r\n    {\r\n        XmlDocument document = value as XmlDocument;\r\n\r\n        if (document != null)\r\n        {\r\n            return document;\r\n        }\r\n\r\n        if (value is IEnumerable<MiiRow> rows)\r\n        {\r\n            return RowsetDocument(rows, value.GetType());\r\n        }\r\n\r\n        if (value is MiiRow)\r\n        {\r\n            XmlDocument rowDocument = new XmlDocument();\r\n            rowDocument.AppendChild(RowElement(rowDocument, value));\r\n            return rowDocument;\r\n        }\r\n\r\n        XmlNode node = value as XmlNode;\r\n\r\n        if (node != null)\r\n        {\r\n            return NodeAsDocument(node);\r\n        }\r\n\r\n        string text = ToStr(value).Trim();\r\n        return text.StartsWith(\"<\") ? ParseXml(text) : new XmlDocument();\r\n    }\r\n\r\n    public static List<string> ToList(object value)\r\n    {\r\n        List<string> list = value as List<string>;\r\n\r\n        if (list != null)\r\n        {\r\n            return list;\r\n        }\r\n\r\n        List<string> result = new List<string>();\r\n\r\n        if (value == null)\r\n        {\r\n            return result;\r\n        }\r\n\r\n        IDictionary<string, string> map = value as IDictionary<string, string>;\r\n\r\n        if (map != null)\r\n        {\r\n            // an Iterator over a map goes through its keys\r\n            result.AddRange(map.Keys);\r\n            return result;\r\n        }\r\n\r\n        System.Collections.IEnumerable items = value as System.Collections.IEnumerable;\r\n\r\n        if (items != null && !(value is string) && !(value is XmlNode))\r\n        {\r\n            foreach (object item in items)\r\n            {\r\n                result.Add(ToStr(item));\r\n            }\r\n\r\n            return result;\r\n        }\r\n\r\n        string text = ToStr(value).Trim();\r\n\r\n        if (text.StartsWith(\"[\") && text.EndsWith(\"]\"))\r\n        {\r\n            foreach (Match match in Regex.Matches(text, @\"\\[(?:[A-Za-z]+:)?([^\\[\\]]*)\\]\"))\r\n            {\r\n                result.Add(match.Groups[1].Value);\r\n            }\r\n\r\n            return result;\r\n        }\r\n\r\n        if (text.Length > 0)\r\n        {\r\n            result.Add(text);\r\n        }\r\n\r\n        return result;\r\n    }\r\n\r\n    public static Dictionary<string, string> ToMap(object value)\r\n    {\r\n        Dictionary<string, string> map = value as Dictionary<string, string>;\r\n\r\n        if (map != null)\r\n        {\r\n            return map;\r\n        }\r\n\r\n        Dictionary<string, string> result = new Dictionary<string, string>();\r\n        IDictionary<string, string> other = value as IDictionary<string, string>;\r\n\r\n        if (other != null)\r\n        {\r\n            foreach (KeyValuePair<string, string> pair in other)\r\n            {\r\n                result[pair.Key] = pair.Value;\r\n            }\r\n\r\n            return result;\r\n        }\r\n\r\n        foreach (Match match in Regex.Matches(ToStr(value), @\"([^{},=\\s][^{},=]*)=\\[(?:[A-Za-z]+:)?([^\\[\\]]*)\\]\"))\r\n        {\r\n            result[match.Groups[1].Value.Trim()] = match.Groups[2].Value;\r\n        }\r\n\r\n        return result;\r\n    }\r\n\r\n    /// <summary>An MII rowset document (or anything that converts to one) as row records, columns matched by name.</summary>\r\n    public static List<T> ToRows<T>(object value) where T : MiiRow, new()\r\n    {\r\n        if (value is List<T> list)\r\n        {\r\n            return list;\r\n        }\r\n\r\n        List<T> rows = [];\r\n        XmlDocument document = ToXml(value);\r\n\r\n        if (document.DocumentElement == null)\r\n        {\r\n            return rows;\r\n        }\r\n\r\n        foreach (XmlNode node in document.SelectNodes(\"/Rowsets/Rowset/Row\"))\r\n        {\r\n            T row = new T();\r\n            FillRow(row, node);\r\n            rows.Add(row);\r\n        }\r\n\r\n        return rows;\r\n    }\r\n\r\n    /// <summary>Row records as an MII rowset document (Rowsets/Rowset with Columns and Row elements).</summary>\r\n    private static XmlDocument RowsetDocument(IEnumerable<MiiRow> rows, Type listType)\r\n    {\r\n        XmlDocument document = new XmlDocument();\r\n        XmlElement rowset = document.CreateElement(\"Rowset\");\r\n        document.AppendChild(document.CreateElement(\"Rowsets\")).AppendChild(rowset);\r\n        XmlElement columns = document.CreateElement(\"Columns\");\r\n        rowset.AppendChild(columns);\r\n        Type rowType = listType.IsGenericType ? listType.GetGenericArguments()[0] : typeof(MiiRow);\r\n\r\n        foreach (PropertyInfo property in ColumnsOf(rowType))\r\n        {\r\n            XmlElement column = document.CreateElement(\"Column\");\r\n            column.SetAttribute(\"Name\", property.Name);\r\n            columns.AppendChild(column);\r\n        }\r\n\r\n        foreach (MiiRow row in rows)\r\n        {\r\n            rowset.AppendChild(RowElement(document, row));\r\n        }\r\n\r\n        return document;\r\n    }\r\n\r\n    public static T ToRow<T>(object value) where T : MiiRow, new()\r\n    {\r\n        if (value is T)\r\n        {\r\n            return (T)value;\r\n        }\r\n\r\n        T row = new T();\r\n        XmlDocument document = ToXml(value);\r\n        XmlNode node = document.SelectSingleNode(\"//Row\") ?? document.DocumentElement;\r\n\r\n        if (node != null)\r\n        {\r\n            FillRow(row, node);\r\n        }\r\n\r\n        return row;\r\n    }\r\n\r\n    // ------------------------------------------------------------------ comparisons\r\n\r\n    /// <summary>== in MII: numbers compare as numbers, everything else as text.</summary>\r\n    public static bool AreEqual(object left, object right)\r\n    {\r\n        if (IsNumber(left) || IsNumber(right))\r\n        {\r\n            double a;\r\n            double b;\r\n\r\n            if (TryNumber(left, out a) && TryNumber(right, out b))\r\n            {\r\n                return a == b;\r\n            }\r\n        }\r\n\r\n        if (left is bool || right is bool)\r\n        {\r\n            return ToBool(left) == ToBool(right);\r\n        }\r\n\r\n        return ToStr(left) == ToStr(right);\r\n    }\r\n\r\n    /// <summary>&lt; &gt; in MII: as numbers when both are numbers, else as text.</summary>\r\n    public static int Compare(object left, object right)\r\n    {\r\n        double a;\r\n        double b;\r\n\r\n        if (TryNumber(left, out a) && TryNumber(right, out b))\r\n        {\r\n            return a.CompareTo(b);\r\n        }\r\n\r\n        if (left is DateTime || right is DateTime)\r\n        {\r\n            return ToDateTime(left).CompareTo(ToDateTime(right));\r\n        }\r\n\r\n        return string.CompareOrdinal(ToStr(left), ToStr(right));\r\n    }\r\n\r\n    private static bool IsNumber(object value)\r\n    {\r\n        return value is int || value is long || value is double || value is decimal || value is float;\r\n    }\r\n\r\n    private static bool TryNumber(object value, out double number)\r\n    {\r\n        if (IsNumber(value))\r\n        {\r\n            number = Convert.ToDouble(value, Invariant);\r\n            return true;\r\n        }\r\n\r\n        return double.TryParse(ToStr(value).Trim(), NumberStyles.Float, Invariant, out number);\r\n    }\r\n\r\n    // ------------------------------------------------------------------ XML\r\n\r\n    public static XmlDocument ParseXml(string text)\r\n    {\r\n        XmlDocument document = new XmlDocument();\r\n\r\n        if (text != null && text.Trim().Length > 0)\r\n        {\r\n            document.LoadXml(text.Trim());\r\n        }\r\n\r\n        return document;\r\n    }\r\n\r\n    /// <summary>Doc{xpath}: the text of the first matching node, or the value of an XPath expression such as count(...).</summary>\r\n    public static string XPath(object source, string xpath)\r\n    {\r\n        XmlDocument document = ToXml(source);\r\n\r\n        if (document.DocumentElement == null)\r\n        {\r\n            return string.Empty;\r\n        }\r\n\r\n        object result = document.CreateNavigator().Evaluate(xpath, Namespaces(document));\r\n        System.Xml.XPath.XPathNodeIterator nodes = result as System.Xml.XPath.XPathNodeIterator;\r\n\r\n        if (nodes != null)\r\n        {\r\n            return nodes.MoveNext() ? nodes.Current.Value : string.Empty;\r\n        }\r\n\r\n        if (result is double)\r\n        {\r\n            double number = (double)result;\r\n            return number == Math.Floor(number) && Math.Abs(number) < 1e15 ? ((long)number).ToString(Invariant) : number.ToString(\"R\", Invariant);\r\n        }\r\n\r\n        return ToStr(result);\r\n    }\r\n\r\n    /// <summary>Doc{xpath} used as XML: the first matching node as a document of its own.</summary>\r\n    public static XmlDocument SelectXml(object source, string xpath)\r\n    {\r\n        XmlDocument document = ToXml(source);\r\n\r\n        if (document.DocumentElement == null)\r\n        {\r\n            return new XmlDocument();\r\n        }\r\n\r\n        XmlNode node = document.SelectSingleNode(xpath, Namespaces(document));\r\n        return node == null ? new XmlDocument() : NodeAsDocument(node);\r\n    }\r\n\r\n    /// <summary>The nodes a repeater runs over, each as a document of its own.</summary>\r\n    public static List<XmlDocument> SelectNodes(object source, string xpath)\r\n    {\r\n        List<XmlDocument> result = new List<XmlDocument>();\r\n        XmlDocument document = ToXml(source);\r\n\r\n        if (document.DocumentElement == null)\r\n        {\r\n            return result;\r\n        }\r\n\r\n        foreach (XmlNode node in document.SelectNodes(xpath, Namespaces(document)))\r\n        {\r\n            result.Add(NodeAsDocument(node));\r\n        }\r\n\r\n        return result;\r\n    }\r\n\r\n    /// <summary>X{key} on a value of unknown type: a map lookup, else an XPath.</summary>\r\n    public static string Select(object source, string key)\r\n    {\r\n        IDictionary<string, string> map = source as IDictionary<string, string>;\r\n\r\n        if (map != null)\r\n        {\r\n            return MapGet(map, key);\r\n        }\r\n\r\n        return XPath(source, key);\r\n    }\r\n\r\n    /// <summary>Assign link with XPath: sets the text of the node (created when the path is a plain element path).</summary>\r\n    public static XmlDocument SetXPathValue(XmlDocument document, string xpath, object value)\r\n    {\r\n        XmlNode node = FindOrCreate(document, xpath);\r\n\r\n        if (node != null)\r\n        {\r\n            node.InnerText = ToStr(value);\r\n        }\r\n\r\n        return document;\r\n    }\r\n\r\n    /// <summary>Assign XML link: without XPath the source document replaces the whole document; at an XPath the selected\r\n    /// node keeps its own element and gets the children and text of the source's root element instead of its own.</summary>\r\n    public static XmlDocument AssignXml(XmlDocument document, string xpath, object source)\r\n    {\r\n        XmlDocument sourceDocument = ToXml(source);\r\n\r\n        if (sourceDocument.DocumentElement == null)\r\n        {\r\n            return document;\r\n        }\r\n\r\n        XmlNode node = FindOrCreate(document, xpath);\r\n\r\n        if (node == null || node == document.DocumentElement || node == document)\r\n        {\r\n            document.RemoveAll();\r\n            document.AppendChild(document.ImportNode(sourceDocument.DocumentElement, true));\r\n            return document;\r\n        }\r\n\r\n        while (node.HasChildNodes)\r\n        {\r\n            node.RemoveChild(node.FirstChild);\r\n        }\r\n\r\n        foreach (XmlNode child in sourceDocument.DocumentElement.ChildNodes)\r\n        {\r\n            node.AppendChild(document.ImportNode(child, true));\r\n        }\r\n\r\n        return document;\r\n    }\r\n\r\n    /// <summary>Append XML link: the source root element becomes the last child of the selected node.</summary>\r\n    public static XmlDocument AppendXml(XmlDocument document, string xpath, object source)\r\n    {\r\n        XmlDocument sourceDocument = ToXml(source);\r\n        XmlNode node = FindOrCreate(document, xpath);\r\n\r\n        if (node != null && sourceDocument.DocumentElement != null)\r\n        {\r\n            node.AppendChild(document.ImportNode(sourceDocument.DocumentElement, true));\r\n        }\r\n\r\n        return document;\r\n    }\r\n\r\n    /// <summary>Append After XML link: the source root element is inserted after the selected node.</summary>\r\n    public static XmlDocument AppendAfterXml(XmlDocument document, string xpath, object source)\r\n    {\r\n        XmlDocument sourceDocument = ToXml(source);\r\n        XmlNode node = FindOrCreate(document, xpath);\r\n\r\n        if (node != null && node.ParentNode != null && sourceDocument.DocumentElement != null)\r\n        {\r\n            node.ParentNode.InsertAfter(document.ImportNode(sourceDocument.DocumentElement, true), node);\r\n        }\r\n\r\n        return document;\r\n    }\r\n\r\n    /// <summary>Replace XML link: the children of the selected node are replaced by the source root element.</summary>\r\n    public static XmlDocument ReplaceXml(XmlDocument document, string xpath, object source)\r\n    {\r\n        XmlDocument sourceDocument = ToXml(source);\r\n        XmlNode node = FindOrCreate(document, xpath);\r\n\r\n        if (node != null && sourceDocument.DocumentElement != null)\r\n        {\r\n            while (node.FirstChild != null)\r\n            {\r\n                node.RemoveChild(node.FirstChild);\r\n            }\r\n\r\n            node.AppendChild(document.ImportNode(sourceDocument.DocumentElement, true));\r\n        }\r\n\r\n        return document;\r\n    }\r\n\r\n    /// <summary>Remove XML link: removes every node the XPath selects.</summary>\r\n    public static XmlDocument RemoveXml(XmlDocument document, string xpath)\r\n    {\r\n        if (document.DocumentElement == null)\r\n        {\r\n            return document;\r\n        }\r\n\r\n        List<XmlNode> nodes = new List<XmlNode>();\r\n\r\n        foreach (XmlNode node in document.SelectNodes(xpath, Namespaces(document)))\r\n        {\r\n            nodes.Add(node);\r\n        }\r\n\r\n        foreach (XmlNode node in nodes)\r\n        {\r\n            if (node.ParentNode != null)\r\n            {\r\n                node.ParentNode.RemoveChild(node);\r\n            }\r\n        }\r\n\r\n        return document;\r\n    }\r\n\r\n    /// <summary>XSLT action.</summary>\r\n    public static XmlDocument XslTransform(object input, object stylesheet)\r\n    {\r\n        XslCompiledTransform transform = new XslCompiledTransform();\r\n\r\n        using (XmlReader reader = new XmlNodeReader(ToXml(stylesheet)))\r\n        {\r\n            transform.Load(reader);\r\n        }\r\n\r\n        StringBuilder output = new StringBuilder();\r\n\r\n        using (StringWriter writer = new StringWriter(output, Invariant))\r\n        {\r\n            transform.Transform(ToXml(input), null, writer);\r\n        }\r\n\r\n        string text = output.ToString().Trim();\r\n        return text.StartsWith(\"<\") ? ParseXml(text) : new XmlDocument();\r\n    }\r\n\r\n    /// <summary>A row for a rowset document that is not typed: column name, value, column name, value, ...</summary>\r\n    public static void AddRow(object document, params object[] columnsAndValues)\r\n    {\r\n        XmlDocument xml = ToXml(document);\r\n        XmlNode rowset = xml.SelectSingleNode(\"/Rowsets/Rowset\");\r\n\r\n        if (rowset == null)\r\n        {\r\n            return;\r\n        }\r\n\r\n        XmlElement row = xml.CreateElement(\"Row\");\r\n\r\n        for (int index = 0; index + 1 < columnsAndValues.Length; index += 2)\r\n        {\r\n            XmlElement cell = xml.CreateElement(ToStr(columnsAndValues[index]));\r\n            cell.InnerText = ToStr(columnsAndValues[index + 1]);\r\n            row.AppendChild(cell);\r\n        }\r\n\r\n        rowset.AppendChild(row);\r\n    }\r\n\r\n    public static List<string> GetListFromXPath(object source, object xpath)\r\n    {\r\n        List<string> result = new List<string>();\r\n        XmlDocument document = ToXml(source);\r\n\r\n        if (document.DocumentElement == null)\r\n        {\r\n            return result;\r\n        }\r\n\r\n        foreach (XmlNode node in document.SelectNodes(ToStr(xpath), Namespaces(document)))\r\n        {\r\n            result.Add(node.InnerText);\r\n        }\r\n\r\n        return result;\r\n    }\r\n\r\n    public static Dictionary<string, string> GetMapFromXPath(object source, object xpath)\r\n    {\r\n        Dictionary<string, string> result = new Dictionary<string, string>();\r\n        XmlDocument document = ToXml(source);\r\n\r\n        if (document.DocumentElement == null)\r\n        {\r\n            return result;\r\n        }\r\n\r\n        foreach (XmlNode node in document.SelectNodes(ToStr(xpath), Namespaces(document)))\r\n        {\r\n            result[node.Name] = node.InnerText;\r\n        }\r\n\r\n        return result;\r\n    }\r\n\r\n    public static string Name(object source)\r\n    {\r\n        XmlDocument document = ToXml(source);\r\n        return document.DocumentElement == null ? string.Empty : document.DocumentElement.Name;\r\n    }\r\n\r\n    private static XmlNamespaceManager Namespaces(XmlDocument document)\r\n    {\r\n        XmlNamespaceManager manager = new XmlNamespaceManager(document.NameTable);\r\n\r\n        foreach (XmlNode node in document.SelectNodes(\"//namespace::*\"))\r\n        {\r\n            string prefix = node.LocalName == \"xmlns\" ? string.Empty : node.LocalName;\r\n\r\n            if (prefix.Length > 0 && prefix != \"xml\" && manager.LookupNamespace(prefix) == null)\r\n            {\r\n                manager.AddNamespace(prefix, node.Value);\r\n            }\r\n        }\r\n\r\n        return manager;\r\n    }\r\n\r\n    private static XmlDocument NodeAsDocument(XmlNode node)\r\n    {\r\n        XmlDocument document = new XmlDocument();\r\n\r\n        if (node is XmlDocument)\r\n        {\r\n            XmlNode root = ((XmlDocument)node).DocumentElement;\r\n\r\n            if (root != null)\r\n            {\r\n                document.AppendChild(document.ImportNode(root, true));\r\n            }\r\n\r\n            return document;\r\n        }\r\n\r\n        if (node is XmlElement)\r\n        {\r\n            document.AppendChild(document.ImportNode(node, true));\r\n            return document;\r\n        }\r\n\r\n        XmlElement value = document.CreateElement(\"Value\");\r\n        value.InnerText = node.Value ?? node.InnerText;\r\n        document.AppendChild(value);\r\n        return document;\r\n    }\r\n\r\n    /// <summary>The node of an XPath; a missing plain element path (/a/b/c) is created.</summary>\r\n    private static XmlNode FindOrCreate(XmlDocument document, string xpath)\r\n    {\r\n        if (document.DocumentElement != null)\r\n        {\r\n            XmlNode found = document.SelectSingleNode(xpath, Namespaces(document));\r\n\r\n            if (found != null)\r\n            {\r\n                return found;\r\n            }\r\n        }\r\n\r\n        if (!Regex.IsMatch(xpath, @\"^(/[A-Za-z_][\\w.\\-]*)+$\"))\r\n        {\r\n            return null;\r\n        }\r\n\r\n        XmlNode current = document;\r\n\r\n        foreach (string name in xpath.Trim('/').Split('/'))\r\n        {\r\n            XmlNode next = null;\r\n\r\n            foreach (XmlNode child in current.ChildNodes)\r\n            {\r\n                if (child.NodeType == XmlNodeType.Element && child.Name == name)\r\n                {\r\n                    next = child;\r\n                    break;\r\n                }\r\n            }\r\n\r\n            if (next == null)\r\n            {\r\n                if (current == document && document.DocumentElement != null)\r\n                {\r\n                    return null;\r\n                }\r\n\r\n                next = document.CreateElement(name);\r\n                current.AppendChild(next);\r\n            }\r\n\r\n            current = next;\r\n        }\r\n\r\n        return current;\r\n    }\r\n\r\n    // ------------------------------------------------------------------ rows (reflection over the generated row classes)\r\n\r\n    public static List<PropertyInfo> ColumnsOf(Type rowType)\r\n    {\r\n        List<PropertyInfo> result = new List<PropertyInfo>();\r\n\r\n        foreach (PropertyInfo property in rowType.GetProperties(BindingFlags.Public | BindingFlags.Instance))\r\n        {\r\n            if (property.CanRead && property.CanWrite && property.GetIndexParameters().Length == 0)\r\n            {\r\n                result.Add(property);\r\n            }\r\n        }\r\n\r\n        return result;\r\n    }\r\n\r\n    public static object RowValue(object row, string column)\r\n    {\r\n        PropertyInfo property = FindColumn(row.GetType(), column);\r\n        return property == null ? null : property.GetValue(row, null);\r\n    }\r\n\r\n    public static XmlElement RowElement(XmlDocument document, object row)\r\n    {\r\n        XmlElement element = document.CreateElement(\"Row\");\r\n\r\n        foreach (PropertyInfo property in ColumnsOf(row.GetType()))\r\n        {\r\n            XmlElement cell = document.CreateElement(property.Name);\r\n            cell.InnerText = ToStr(property.GetValue(row, null));\r\n            element.AppendChild(cell);\r\n        }\r\n\r\n        return element;\r\n    }\r\n\r\n    public static void FillRow(object row, XmlNode node)\r\n    {\r\n        foreach (XmlNode cell in node.ChildNodes)\r\n        {\r\n            if (cell.NodeType != XmlNodeType.Element)\r\n            {\r\n                continue;\r\n            }\r\n\r\n            PropertyInfo property = FindColumn(row.GetType(), cell.LocalName);\r\n\r\n            if (property != null)\r\n            {\r\n                property.SetValue(row, ConvertTo(cell.InnerText, property.PropertyType), null);\r\n            }\r\n        }\r\n    }\r\n\r\n    private static PropertyInfo FindColumn(Type rowType, string column)\r\n    {\r\n        string wanted = Simplify(column);\r\n        PropertyInfo loose = null;\r\n\r\n        foreach (PropertyInfo property in ColumnsOf(rowType))\r\n        {\r\n            if (property.Name == column)\r\n            {\r\n                return property;\r\n            }\r\n\r\n            if (loose == null && Simplify(property.Name) == wanted)\r\n            {\r\n                loose = property;\r\n            }\r\n        }\r\n\r\n        return loose;\r\n    }\r\n\r\n    private static string Simplify(string name)\r\n    {\r\n        StringBuilder result = new StringBuilder();\r\n\r\n        foreach (char c in name)\r\n        {\r\n            if (char.IsLetterOrDigit(c))\r\n            {\r\n                result.Append(char.ToLowerInvariant(c));\r\n            }\r\n        }\r\n\r\n        return result.ToString();\r\n    }\r\n\r\n    private static object ConvertTo(string text, Type type)\r\n    {\r\n        if (type == typeof(string)) return text;\r\n\r\n        if (type == typeof(bool)) return ToBool(text);\r\n\r\n        if (type == typeof(int)) return ToInt(text);\r\n\r\n        if (type == typeof(long)) return ToLong(text);\r\n\r\n        if (type == typeof(double)) return ToDouble(text);\r\n\r\n        if (type == typeof(decimal)) return ToDecimal(text);\r\n\r\n        if (type == typeof(DateTime)) return ToDateTime(text);\r\n        return text;\r\n    }\r\n\r\n    // ------------------------------------------------------------------ lists and maps\r\n\r\n    public static List<string> List(params object[] values)\r\n    {\r\n        List<string> result = new List<string>();\r\n\r\n        foreach (object value in values)\r\n        {\r\n            // a list argument contributes its elements: list(Local.Items, x) is a new, longer list\r\n            List<string> items = value as List<string>;\r\n\r\n            if (items != null)\r\n            {\r\n                result.AddRange(items);\r\n            }\r\n            else\r\n            {\r\n                result.Add(ToStr(value));\r\n            }\r\n        }\r\n\r\n        return result;\r\n    }\r\n\r\n    public static Dictionary<string, string> Map(params object[] keysAndValues)\r\n    {\r\n        Dictionary<string, string> result = new Dictionary<string, string>();\r\n\r\n        for (int index = 0; index + 1 < keysAndValues.Length; index += 2)\r\n        {\r\n            result[ToStr(keysAndValues[index])] = ToStr(keysAndValues[index + 1]);\r\n        }\r\n\r\n        return result;\r\n    }\r\n\r\n    public static string MapGet(object map, string key)\r\n    {\r\n        string value;\r\n        // a missing key reads as the text \"null\" in MII, which is no empty text\r\n        return ToMap(map).TryGetValue(key, out value) ? value : \"null\";\r\n    }\r\n\r\n    public static string GetValueFromMap(object map, object key)\r\n    {\r\n        return MapGet(map, ToStr(key));\r\n    }\r\n\r\n    public static string ListGet(object list, int index)\r\n    {\r\n        List<string> items = ToList(list);\r\n        return index >= 0 && index < items.Count ? items[index] : string.Empty;\r\n    }\r\n\r\n    public static int Size(object value)\r\n    {\r\n        IDictionary<string, string> map = value as IDictionary<string, string>;\r\n\r\n        if (map != null)\r\n        {\r\n            return map.Count;\r\n        }\r\n\r\n        return ToList(value).Count;\r\n    }\r\n\r\n    /// <summary>append() works by reference in MII: the list itself gets the value.</summary>\r\n    public static List<string> Append(object list, object value)\r\n    {\r\n        List<string> items = ToList(list);\r\n        items.Add(ToStr(value));\r\n        return items;\r\n    }\r\n\r\n    public static List<string> Insert(object list, object index, object value)\r\n    {\r\n        List<string> items = ToList(list);\r\n        items.Insert(Math.Max(0, Math.Min(items.Count, ToInt(index))), ToStr(value));\r\n        return items;\r\n    }\r\n\r\n    public static List<string> Set(object list, object index, object value)\r\n    {\r\n        List<string> items = ToList(list);\r\n        int position = ToInt(index);\r\n\r\n        if (position >= 0 && position < items.Count)\r\n        {\r\n            items[position] = ToStr(value);\r\n        }\r\n\r\n        return items;\r\n    }\r\n\r\n    public static List<string> Remove(object list, object index)\r\n    {\r\n        List<string> items = ToList(list);\r\n        int position = ToInt(index);\r\n\r\n        if (position >= 0 && position < items.Count)\r\n        {\r\n            items.RemoveAt(position);\r\n        }\r\n\r\n        return items;\r\n    }\r\n\r\n    /// <summary>remove(map, key): the map without the key.</summary>\r\n    public static Dictionary<string, string> RemoveKey(object map, object key)\r\n    {\r\n        Dictionary<string, string> items = ToMap(map);\r\n        items.Remove(ToStr(key));\r\n        return items;\r\n    }\r\n\r\n    public static int Find(object list, object value)\r\n    {\r\n        return ToList(list).IndexOf(ToStr(value));\r\n    }\r\n\r\n    /// <summary>first() of an empty list fails in MII.</summary>\r\n    public static string First(object list)\r\n    {\r\n        List<string> items = ToList(list);\r\n\r\n        if (items.Count == 0)\r\n        {\r\n            throw new InvalidOperationException(\"first() of an empty list fails in MII\");\r\n        }\r\n\r\n        return items[0];\r\n    }\r\n\r\n    /// <summary>last() of an empty list fails in MII.</summary>\r\n    public static string Last(object list)\r\n    {\r\n        List<string> items = ToList(list);\r\n\r\n        if (items.Count == 0)\r\n        {\r\n            throw new InvalidOperationException(\"last() of an empty list fails in MII\");\r\n        }\r\n\r\n        return items[items.Count - 1];\r\n    }\r\n\r\n    public static List<string> Sort(object list)\r\n    {\r\n        List<string> items = new List<string>(ToList(list));\r\n        items.Sort(StringComparer.Ordinal);\r\n        return items;\r\n    }\r\n\r\n    public static List<string> Keys(object map)\r\n    {\r\n        return new List<string>(ToMap(map).Keys);\r\n    }\r\n\r\n    public static List<string> Values(object map)\r\n    {\r\n        return new List<string>(ToMap(map).Values);\r\n    }\r\n\r\n    public static Dictionary<string, string> Put(object map, object key, object value)\r\n    {\r\n        Dictionary<string, string> items = ToMap(map);\r\n        items[ToStr(key)] = ToStr(value);\r\n        return items;\r\n    }\r\n\r\n    public static bool ContainsKey(object map, object key)\r\n    {\r\n        return ToMap(map).ContainsKey(ToStr(key));\r\n    }\r\n\r\n    public static bool ContainsValue(object map, object value)\r\n    {\r\n        return ToMap(map).ContainsValue(ToStr(value));\r\n    }\r\n\r\n    public static Dictionary<string, string> ListsToMap(object keys, object values)\r\n    {\r\n        List<string> keyList = ToList(keys);\r\n        List<string> valueList = ToList(values);\r\n        SortedDictionary<string, string> sorted = new SortedDictionary<string, string>(StringComparer.Ordinal);\r\n\r\n        for (int index = 0; index < keyList.Count; index++)\r\n        {\r\n            sorted[keyList[index]] = index < valueList.Count ? valueList[index] : string.Empty;\r\n        }\r\n\r\n        // liststomap sorts its keys in MII (map() keeps no order at all)\r\n        return new Dictionary<string, string>(sorted);\r\n    }\r\n\r\n    /// <summary>Splits on a regular expression (default \",\"); further MII arguments are ignored.</summary>\r\n    public static List<string> StringToList(object text, params object[] options)\r\n    {\r\n        string delimiter = options.Length > 0 ? ToStr(options[0]) : \",\";\r\n        return new List<string>(Regex.Split(ToStr(text), delimiter));\r\n    }\r\n\r\n    public static List<string> StringToListWithLimit(object text, object delimiter, object limit)\r\n    {\r\n        return new List<string>(new Regex(ToStr(delimiter)).Split(ToStr(text), Math.Max(1, ToInt(limit))));\r\n    }\r\n\r\n    public static string ListToString(object list, params object[] delimiter)\r\n    {\r\n        string separator = delimiter.Length > 0 ? ToStr(delimiter[0]) : \",\";\r\n        return string.Join(separator, ToList(list).ToArray());\r\n    }\r\n\r\n    public static List<string> TimeZoneIds()\r\n    {\r\n        List<string> result = new List<string>();\r\n\r\n        foreach (TimeZoneInfo zone in TimeZoneInfo.GetSystemTimeZones())\r\n        {\r\n            result.Add(zone.Id);\r\n        }\r\n\r\n        return result;\r\n    }\r\n\r\n    // ------------------------------------------------------------------ strings\r\n\r\n    public static string StringLeft(object text, object length)\r\n    {\r\n        string value = ToStr(text);\r\n        return value.Substring(0, Math.Max(0, Math.Min(value.Length, ToInt(length))));\r\n    }\r\n\r\n    public static string StringRight(object text, object length)\r\n    {\r\n        string value = ToStr(text);\r\n        int count = Math.Max(0, Math.Min(value.Length, ToInt(length)));\r\n        return value.Substring(value.Length - count);\r\n    }\r\n\r\n    /// <summary>stringpart(text, start, length) with a 1-based start: stringpart(\"Football\", 1, 1) = \"F\".</summary>\r\n    public static string StringPart(object text, object start, object length)\r\n    {\r\n        string value = ToStr(text);\r\n        int begin = Math.Max(0, ToInt(start) - 1);\r\n\r\n        if (begin >= value.Length)\r\n        {\r\n            return string.Empty;\r\n        }\r\n\r\n        return value.Substring(begin, Math.Max(0, Math.Min(value.Length - begin, ToInt(length))));\r\n    }\r\n\r\n    public static int StringIndexOf(object text, object part)\r\n    {\r\n        return ToStr(text).IndexOf(ToStr(part), StringComparison.Ordinal);\r\n    }\r\n\r\n    public static int StringLastIndexOf(object text, object part)\r\n    {\r\n        return ToStr(text).LastIndexOf(ToStr(part), StringComparison.Ordinal);\r\n    }\r\n\r\n    /// <summary>stringreplace replaces every occurrence (literal text).</summary>\r\n    public static string StringReplace(object text, object find, object replacement)\r\n    {\r\n        string search = ToStr(find);\r\n        return search.Length == 0 ? ToStr(text) : ToStr(text).Replace(search, ToStr(replacement));\r\n    }\r\n\r\n    /// <summary>stringreplaceall replaces every match of a regular expression; MII drops the blanks of the replacement\r\n    /// text (\"$1 \" inserts the group only).</summary>\r\n    public static string StringReplaceAll(object text, object pattern, object replacement)\r\n    {\r\n        return Regex.Replace(ToStr(text), ToStr(pattern), ToStr(replacement).Replace(\" \", string.Empty));\r\n    }\r\n\r\n    /// <summary>MII's empty check: null, \"\", blanks, the text \"null\" or \"---\" (any case), as match(x, \"(?i)^\\s*(null|---)?\\s*$\").</summary>\r\n    public static bool IsEmpty(object value)\r\n    {\r\n        return EmptyValue.IsMatch(ToStr(value));\r\n    }\r\n\r\n    /// <summary>MII's boolean check on text: \"true\" or \"1\" (any case, blanks around), as match(x, \"(?i)^\\s*(true|1)\\s*$\").</summary>\r\n    public static bool IsTrue(object value)\r\n    {\r\n        return TrueValue.IsMatch(ToStr(value));\r\n    }\r\n\r\n    /// <summary>match(text, pattern) with more arguments than usual; case-sensitive like on the system.</summary>\r\n    public static bool Match(object text, object pattern, params object[] ignored)\r\n    {\r\n        return Regex.IsMatch(ToStr(text), ToStr(pattern));\r\n    }\r\n\r\n    /// <summary>match2(text, pattern, caseSensitive).</summary>\r\n    public static bool Match2(object text, object pattern, params object[] caseSensitive)\r\n    {\r\n        bool sensitive = caseSensitive.Length == 0 || ToBool(caseSensitive[0]);\r\n        return Regex.IsMatch(ToStr(text), ToStr(pattern), sensitive ? RegexOptions.None : RegexOptions.IgnoreCase);\r\n    }\r\n\r\n    public static string Quotes(object text)\r\n    {\r\n        return \"\\\"\" + ToStr(text) + \"\\\"\";\r\n    }\r\n\r\n    /// <summary>encode is form encoding (a blank becomes +).</summary>\r\n    public static string Encode(object text)\r\n    {\r\n        return System.Net.WebUtility.UrlEncode(ToStr(text));\r\n    }\r\n\r\n    /// <summary>decode is form decoding (+ becomes a blank).</summary>\r\n    public static string Decode(object text)\r\n    {\r\n        return System.Net.WebUtility.UrlDecode(ToStr(text));\r\n    }\r\n\r\n    public static string Base64Encode
